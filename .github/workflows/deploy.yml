name: Push to Docker & Deploy to AWS

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Backend
        run: |
          docker build -t samcantdock/mynotes-backend:latest ./backend
          docker push samcantdock/mynotes-backend:latest

      - name: Build and Push Frontend
        run: |
          docker build -t samcantdock/mynotes-frontend:latest ./frontend
          docker push samcantdock/mynotes-frontend:latest

  deploy-to-aws:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Update Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            cd ~/mynotes
            docker compose pull
            docker compose up -d --remove-orphans